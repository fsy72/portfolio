<section id="projets" class="py-16 bg-gray-50">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-12">
      <p class="section-eyebrow">Portfolio</p>
      <h2 class="font-bold text-5xl mb-3" style="color:var(--secondary)">Mes projets récents</h2>
      <p class="text-gray-500 mx-auto max-w-lg">Découvrez une sélection de mes réalisations les plus significatives</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Projets -->
      <div *ngFor="let projet of projets" class="card-hover bg-white rounded-xl shadow-sm overflow-hidden flex flex-col">
        <div class="project-img-wrap">
          <img src="images/{{ projet.image }}" alt="Projet 1"/>
          <div class="project-overlay">
            <div class="flex gap-2">
              <a href="{{ projet.hrefExplore }}" class="bg-white rounded-full p-2 shadow hover:bg-gray-100 transition"><i class="bi bi-box-arrow-up-right"></i></a>
              <a href="{{ projet.hrefGithub }}" class="bg-white rounded-full p-2 shadow hover:bg-gray-100 transition"><i class="bi bi-github"></i></a>
            </div>
          </div>
        </div>
        <div class="p-6 flex-1 flex flex-col">
          <h5 class="font-bold mb-2" style="color:var(--secondary)">{{ projet.nameProject }}</h5>
          <p class="text-gray-500 text-sm mb-3">{{ projet.description }}</p>
          <div class="flex flex-wrap gap-1 mt-auto">
            <span *ngFor="let outil of projet.outils" class="badge-tech bg-[var(--primary)]/10 text-[var(--primary)] text-xs font-medium rounded-full px-3 py-1">{{ outil }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
