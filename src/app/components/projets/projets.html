<section id="projets" class="py-5 bg-light">
  <div class="container py-5">
    <div class="text-center mb-5">
      <p class="section-eyebrow">Portfolio</p>
      <h2 class="fw-bold fs-1 mb-3" style="color:var(--secondary)">Mes projets récents</h2>
      <p class="text-muted mx-auto" style="max-width:520px">Découvrez une sélection de mes réalisations les plus significatives</p>
    </div>

    <div class="row g-4">
      <!-- Projets -->
      <div *ngFor="let projet of projets" class="col-md-6 col-lg-4">
        <div class="card card-hover shadow-sm h-100">
          <div class="project-img-wrap">
            <img src="images/{{ projet.image }}" alt="Projet 1"/>
            <div class="project-overlay">
              <div class="d-flex gap-2">
                <a href="{{ projet.hrefExplore }}" class="btn btn-light btn-sm rounded-circle p-2"><i class="bi bi-box-arrow-up-right"></i></a>
                <a href="{{ projet.hrefGithub }}" class="btn btn-light btn-sm rounded-circle p-2"><i class="bi bi-github"></i></a>
              </div>
            </div>
          </div>
          <div class="card-body p-4">
            <h5 class="fw-bold mb-2" style="color:var(--secondary)">{{ projet.nameProject }}</h5>
            <p class="text-muted small mb-3">{{ projet.description }}</p>
            <div class="d-flex flex-wrap gap-1">
              <span *ngFor="let outil of projet.outils" class="badge badge-tech bg-primary bg-opacity-10 text-primary">{{ outil }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
