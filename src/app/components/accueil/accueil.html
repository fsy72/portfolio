<section id="accueil">
  <div class="max-w-6xl mx-auto px-4 text-center py-16">

    <!-- ★ PHOTO DE PROFIL ★ -->
    <div class="profile-wrapper inline-block mb-6">
      <img id="profilePhoto"
           src="images/profil_pro.png"
           alt="Photo de profil"
           class="profile-photo"/>
      <!-- <label class="photo-upload-btn" for="photoInput" title="Changer la photo">
        <i class="bi bi-camera-fill"></i>
      </label>
      <input type="file" id="photoInput" accept="image/*"/> -->
    </div>

    <p class="section-eyebrow mb-3 uppercase tracking-widest">Bonjour, je suis</p>
    <h1 class="text-5xl md:text-7xl font-bold leading-none mb-4" style="color:var(--secondary)">
      Fallou <span class="gradient-text">SY</span>
    </h1>
    <p class="text-2xl font-semibold text-gray-500 mb-2">Développeur Full-Stack &amp; Ingénieur Logiciel</p>
    <p class="text-lg text-gray-500 mb-10 mx-auto max-w-xl">
      Étudiant en Master 2 GDIL à l'Université Gaston Berger, je viens de réaliser un stage de trois mois au CCOS et m'apprête à y débuter un CDD.
    </p>
    <div class="flex flex-wrap gap-3 justify-center mb-10">
      <a href="#projets" (click)="scrollTo('projets', $event)" class="inline-flex items-center bg-[var(--primary)] text-white text-lg rounded-full px-8 py-3 font-semibold shadow-lg hover:opacity-90 transition">
        Voir mes projets <i class="bi bi-arrow-down ml-2"></i>
      </a>
      <a href="#contact" (click)="scrollTo('contact', $event)" class="inline-flex items-center border border-gray-400 text-gray-700 text-lg rounded-full px-8 py-3 font-semibold hover:bg-gray-50 transition">
        Me contacter <i class="bi bi-envelope ml-2"></i>
      </a>
    </div>
    <div class="flex justify-center gap-6">
      <a href="#" class="text-gray-600 hover:text-[var(--primary)] text-xl transition-colors"><i class="bi bi-github"></i></a>
      <a href="#" class="text-gray-600 hover:text-[var(--primary)] text-xl transition-colors"><i class="bi bi-linkedin"></i></a>
      <a href="#" class="text-gray-600 hover:text-[var(--primary)] text-xl transition-colors"><i class="bi bi-twitter-x"></i></a>
      <a href="#" class="text-gray-600 hover:text-[var(--primary)] text-xl transition-colors"><i class="bi bi-dribbble"></i></a>
    </div>
  </div>
</section>
