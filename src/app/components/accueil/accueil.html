<section id="accueil">
  <div class="container text-center py-3">

    <!-- ★ PHOTO DE PROFIL ★ -->
    <div class="profile-wrapper d-inline-block mb-4">
      <img id="profilePhoto"
           src="images/profil_pro.png"
           alt="Photo de profil"
           class="profile-photo"/>
      <!-- <label class="photo-upload-btn" for="photoInput" title="Changer la photo">

    <p class="section-eyebrow mb-3 text-uppercase ls-wide">Bonjour, je suis</p>

    </p>
    <div class="d-flex flex-wrap gap-3 justify-content-center mb-5">

      </a>
      <a href="#contact" (click)="scrollTo('contact', $event)" class="btn btn-outline-secondary btn-lg rounded-pill px-5 fw-semibold">

      </a>
    </div>
    <div class="d-flex justify-content-center gap-4">
      <a href="#" class="text-secondary fs-5 text-decoration-none"><i class="bi bi-github"></i></a>
      <a href="#" class="text-secondary fs-5 text-decoration-none"><i class="bi bi-linkedin"></i></a>
      <a href="#" class="text-secondary fs-5 text-decoration-none"><i class="bi bi-twitter-x"></i></a>
      <a href="#" class="text-secondary fs-5 text-decoration-none"><i class="bi bi-dribbble"></i></a>
