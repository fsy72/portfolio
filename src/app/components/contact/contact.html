<section id="contact" class="py-16">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-12">
      <p class="text-primary font-semibold">Contact</p>
      <h2 class="font-bold text-5xl mb-3">Travaillons ensemble</h2>
      <p class="text-white/60 mx-auto max-w-md">Vous avez un projet en tête ? N'hésitez pas à me contacter. Je suis
        toujours ouvert aux nouvelles opportunités.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
      <!-- Infos -->
      <div class="lg:col-span-5">
        <div class="flex flex-col gap-6">
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-envelope-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Email</p>
              <p class="font-semibold mb-0">fallousy72@email.com</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-telephone-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Téléphone</p>
              <p class="font-semibold mb-0">+221 78 128 11 25</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Localisation</p>
              <p class="font-semibold mb-0">Thiès, Sénégal 🇸🇳</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="lg:col-span-7">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="mb-1 block text-sm font-medium text-white/80">Nom</label>
            <input type="text" formControlName="name" placeholder="Votre nom"
              class="w-full rounded-lg border border-white/20 placeholder-white/40 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-white/80">Email</label>
            <input type="email" formControlName="email" placeholder="votre@email.com"
              class="w-full rounded-lg border border-white/20 placeholder-white/40 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-medium text-white/80">Sujet</label>
            <input type="text" formControlName="subject" placeholder="Projet, stage, collaboration..."
              class="w-full rounded-lg border border-white/20 placeholder-white/40 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-medium text-white/80">Message</label>
            <textarea rows="5" formControlName="message" placeholder="Votre message..."
              class="w-full rounded-lg border border-white/20 placeholder-white/40 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"></textarea>
          </div>

          <!-- honeypot : invisible pour les humains -->
          <input type="text" formControlName="website" tabindex="-1" autocomplete="off" class="absolute -left-[9999px]"
            aria-hidden="true" />

          <div class="sm:col-span-2">
            <button type="submit" [disabled]="form.invalid || sending"
              class="w-full rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
              {{ sending ? 'Envoi...' : 'Envoyer le message' }}
            </button>
            <p *ngIf="sent" class="mt-3 text-sm text-green-600">
              Message envoyé, merci ! Je vous réponds vite.
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
