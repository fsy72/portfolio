<section id="contact" class="py-5">
  <div class="container py-5">
    <div class="text-center mb-5">
      <p class="text-primary fw-semibold">Contact</p>
      <h2 class="fw-bold fs-1 mb-3">Travaillons ensemble</h2>
      <p class="text-white-50 mx-auto" style="max-width:480px">Vous avez un projet en tête ? N'hésitez pas à me contacter. Je suis toujours ouvert aux nouvelles opportunités.</p>
    </div>
    <div class="row g-5 align-items-start">
      <!-- Infos -->
      <div class="col-lg-5">
        <div class="d-flex flex-column gap-4">
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-envelope-fill"></i></div>
            <div>
              <p class="text-white-50 small mb-0">Email</p>
              <p class="fw-semibold mb-0">votre@email.com</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-telephone-fill"></i></div>
            <div>
              <p class="text-white-50 small mb-0">Téléphone</p>
              <p class="fw-semibold mb-0">+221 XX XXX XX XX</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div>
            <div>
              <p class="text-white-50 small mb-0">Localisation</p>
              <p class="fw-semibold mb-0">Dakar, Sénégal 🇸🇳</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="col-lg-7">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label>Nom</label>
              <input type="text" class="form-control" placeholder="Votre nom"/>
            </div>
            <div class="col-md-6">
              <label>Email</label>
              <input type="email" class="form-control" placeholder="votre@email.com"/>
            </div>
            <div class="col-12">
              <label>Sujet</label>
              <input type="text" class="form-control" placeholder="Sujet du message"/>
            </div>
            <div class="col-12">
              <label>Message</label>
              <textarea class="form-control" rows="4" placeholder="Votre message..."></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold rounded-3">
                Envoyer le message <i class="bi bi-send ms-2"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
