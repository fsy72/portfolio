<section id="contact" class="py-16">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-12">
      <p class="text-primary font-semibold">Contact</p>
      <h2 class="font-bold text-5xl mb-3">Travaillons ensemble</h2>
      <p class="text-white/60 mx-auto max-w-md">Vous avez un projet en tête ? N'hésitez pas à me contacter. Je suis
        toujours ouvert aux nouvelles opportunités.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
      <!-- Infos -->
      <div class="lg:col-span-5">
        <div class="flex flex-col gap-6">
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-envelope-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Email</p>
              <p class="font-semibold mb-0">fallousy72@email.com</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-telephone-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Téléphone</p>
              <p class="font-semibold mb-0">+221 78 128 11 25</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Localisation</p>
              <p class="font-semibold mb-0">Thiès, Sénégal 🇸🇳</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="lg:col-span-7">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <div class="col-md-6">
              <label>Nom</label>
              <input type="text" class="form-control" formControlName="name" placeholder="Votre nom" />
            </div>
            <div class="col-md-6">
              <label>Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="votre@email.com" />
            </div>
            <div class="col-12">
              <label>Sujet</label>
              <input type="text" class="form-control" formControlName="subject"
                placeholder="Projet, stage, collaboration..." />
            </div>
            <div class="col-12">
              <label>Message</label>
              <textarea class="form-control" rows="4" formControlName="message"
                placeholder="Votre message..."></textarea>
            </div>

            <!-- honeypot : invisible pour les humains -->
            <input type="text" formControlName="website" tabindex="-1" autocomplete="off"
              style="position:absolute;left:-9999px" aria-hidden="true" />

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold rounded-3"
                [disabled]="form.invalid || sending">
                {{ sending ? 'Envoi...' : 'Envoyer le message' }}
              </button>
              <p *ngIf="sent" class="text-success mt-3 mb-0">Message envoyé, merci ! Je te réponds vite.</p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
