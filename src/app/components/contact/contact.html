<section id="contact" class="py-16">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-12">
      <p class="text-[var(--primary)] font-semibold">Contact</p>
      <h2 class="font-bold text-5xl mb-3">Travaillons ensemble</h2>
      <p class="text-white/60 mx-auto max-w-md">Vous avez un projet en tête ? N'hésitez pas à me contacter. Je suis toujours ouvert aux nouvelles opportunités.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
      <!-- Infos -->
      <div class="lg:col-span-5">
        <div class="flex flex-col gap-6">
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-envelope-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Email</p>
              <p class="font-semibold mb-0">fallousy72@email.com</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-telephone-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Téléphone</p>
              <p class="font-semibold mb-0">+221 78 128 11 25</p>
            </div>
          </div>
          <div class="contact-info-item">
            <div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div>
            <div>
              <p class="text-white/60 text-sm mb-0">Localisation</p>
              <p class="font-semibold mb-0">Thiès, Sénégal 🇸🇳</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="lg:col-span-7">
        <form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block mb-1 text-sm font-medium text-white/80">Nom</label>
              <input type="text" class="w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[var(--primary)]" placeholder="Votre nom"/>
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium text-white/80">Email</label>
              <input type="email" class="w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[var(--primary)]" placeholder="votre@email.com"/>
            </div>
            <div class="md:col-span-2">
              <label class="block mb-1 text-sm font-medium text-white/80">Sujet</label>
              <input type="text" class="w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[var(--primary)]" placeholder="Sujet du message"/>
            </div>
            <div class="md:col-span-2">
              <label class="block mb-1 text-sm font-medium text-white/80">Message</label>
              <textarea class="w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-[var(--primary)]" rows="4" placeholder="Votre message..."></textarea>
            </div>
            <div class="md:col-span-2">
              <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-[var(--primary)] text-white py-3 font-semibold rounded-lg hover:opacity-90 transition">
                Envoyer le message <i class="bi bi-send"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
